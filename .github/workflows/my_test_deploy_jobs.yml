  name: Test and Deploy

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

  jobs:
    Test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '24'
        
        - name: Install dependencies
          run: npm install
        
        - name: Run tests
          run: npm run check > test.txt
        
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: test.txt
        
        - name: Print the test results
          run: cat test.txt
    
    Deploy:
      runs-on: self-hosted
      needs: Test
      steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: test-results
            path: .
        
        - name: Deploy application
          run: |
            cd "$HOME/CI_CD_automated-deployment_practice"

            pm2 delete node-app || true

            git pull

            npm install

            pm2 start "./src/server.js" --name node-app

            pm2 save