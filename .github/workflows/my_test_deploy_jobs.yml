  name: Test and Deploy

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

  jobs:
    Test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
              node-version: '22'
        
        - name: Install dependencies
          run: npm install
        
        - name: Run tests
          run: npm run check > test.txt
        
        - name: Print the test results
          run: cat test.txt
    
