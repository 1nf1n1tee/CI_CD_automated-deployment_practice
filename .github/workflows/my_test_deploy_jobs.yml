  name: Test and Deploy

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

  jobs:
    Test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '24'
        
        - name: Install dependencies
          run: npm install
        
        - name: Run tests
          run: npm run check > test.txt
        
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: test.txt
        
        - name: Print the test results
          run: cat test.txt
    
    Deploy:
      runs-on: self-hosted
      needs: Test
      steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: test-results
            path: .
        - name: locate to directory
          run: cd CI_CD_automated-deployment_practice/
        
        - name: Stop existing application
          run: pm2 delete node-app || true

        - name: git pull
          run: git pull origin main
        
        - name: install dependencies
          run: npm install
        
        - name: Start the application
          run: pm2 start "./src/server.js" --name node-app
        
        - name: Save process list
          run: pm2 save